<rect x="45" y="1075" width="1110" height="160" rx="8" fill="#f2f6f9" stroke="#bfd0dd"/>
<text x="65" y="1106" class="h">Bestätigte Modellannahmen (aktiv in config.yaml; Materialwerte vorläufig)</text>
<text x="65" y="1135">• Schlauch: ±45° zur Spannweite; ideal verklebt mit Kern und UD-Gurten.</text>
<text x="65" y="1162">• Depron: ρ = 40 kg/m³, E = 20 MPa, ν = 0,30 – vorläufige Ersatzwerte.</text>
<text x="65" y="1189">• Gurt: max(Excel-Keil, 6 mm); 5-mm-Depronkern unverändert bis zur Spitze.</text>
<text x="65" y="1216">• ANNAHME: CFK je Wand max(Excel R, 0,10 mm); keine Wanddicke null an der Spitze.</text>
<text x="45" y="1263" class="small">Bestätigt: keilförmiger Gurt, gerade Hinterkante, 35-mm-Tasche, 5-mm-Kerne; vorderer Steg bis 0,70 m.</text>
