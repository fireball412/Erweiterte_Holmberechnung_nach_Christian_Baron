<text x="390" y="913">Gurt bleibt mindestens 6 mm breit, hintere Kante gerade.</text>
<text x="390" y="944">Kernmitte y = 3 mm; kein seitlicher Schlauchüberstand.</text>
<text x="390" y="975">B: Außenhöhe 6,17 mm; Gurte je 1,00 mm.</text>
